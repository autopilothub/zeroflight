link:
  protocol: msp
  device: "/dev/serial0"
  baud: 115200
  poll_hz: 10

# MAVLink settings (only used when link.protocol: mavlink)
mavlink:
  connection: "serial:/dev/serial0:115200"
  device: "/dev/serial0"
  baud: 115200
  target_system_id: 1
  target_component_id: 1
  out_system_id: 255
  out_component_id: 190
  version: 2

safety:
  max_altitude_m: 120
  max_radius_m: 500
  arrival_radius_m: 3
  arrival_altitude_m: 2
  link_timeout_sec: 3

api:
  listen: "127.0.0.1:8080"
