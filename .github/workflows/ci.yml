name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o zeroflight ./cmd/zeroflight
      - name: Cross-compile arm64
        run: GOOS=linux GOARCH=arm64 go build -o zeroflight-arm64 ./cmd/zeroflight
